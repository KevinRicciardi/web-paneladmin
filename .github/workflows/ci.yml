name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

jobs:
  # Busca credenciales en los commits nuevos. El historial viejo todavía
  # tiene un .env (ver auditoría PIN-001): hasta purgarlo, se escanea solo
  # lo que trae cada push o PR.
  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run
      # El build exige VITE_API_URL https (vite.config.ts); acá alcanza
      # con una de mentira.
      - run: npm run build
        env:
          VITE_API_URL: https://api.ejemplo.com
      - run: npm audit --omit=dev --audit-level=high
