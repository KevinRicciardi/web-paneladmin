server {
    listen 80;
    server_name _;

    # No anunciar la versión de nginx en los errores ni en los headers.
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Headers de seguridad. HSTS va en el proxy que termina TLS
    # (Coolify/Traefik): Strict-Transport-Security: max-age=31536000; includeSubDomains
    # - X-Frame-Options: nadie puede meter el panel en un iframe (clickjacking).
    # - nosniff: el navegador no adivina tipos de archivo.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # CSP en modo "solo reportar": no bloquea nada todavía, solo avisa en la
    # consola del navegador lo que bloquearía. Cuando el panel se use un
    # tiempo sin avisos, cambiar el header a "Content-Security-Policy".
    # (Las fuentes de hls.js y el login con Google de Firebase están
    # contempladas.)
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://apis.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' https: data: blob:; media-src 'self' https: blob:; connect-src 'self' https: wss:; frame-src https://player.kick.com https://kick.com https://www.youtube.com https://www.youtube-nocookie.com https://player.twitch.tv https://*.firebaseapp.com https://accounts.google.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # SPA: React Router resuelve las rutas en el navegador, no son
    # archivos reales en disco. Si no encontramos el archivo pedido,
    # servimos igual index.html para que React Router tome el control
    # (sin esto, F5 en una ruta como /tenants/5 tira 404).
    location / {
        try_files $uri /index.html;
    }

    # index.html siempre fresco, así un deploy nuevo se ve al toque. Un
    # add_header dentro de un location reemplaza los de arriba: se repiten.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://apis.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' https: data: blob:; media-src 'self' https: blob:; connect-src 'self' https: wss:; frame-src https://player.kick.com https://kick.com https://www.youtube.com https://www.youtube-nocookie.com https://player.twitch.tv https://*.firebaseapp.com https://accounts.google.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }
}
